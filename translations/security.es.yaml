'An authentication exception occurred.': 'Ocurrió un error de autenticación.'
'Authentication credentials could not be found.': 'No se encontraron las credenciales de autenticación.'
'Authentication request could not be processed due to a system problem.': 'La solicitud no pudo procesarse debido a un problema técnico.'
'Invalid credentials.': 'Credenciales inválidas. Verifica tu correo y contraseña.'
'Cookie has already been used by someone else.': 'La cookie ya ha sido utilizada por otro usuario.'
'Insufficient privileges to access this resource.': 'No tienes permisos suficientes para acceder a este recurso.'
