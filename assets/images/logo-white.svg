<svg viewBox="0 0 340 76" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Logo GPI</title>
  <desc>Isotipo institucional #14212B con borde blanco, barras ascendentes y punto ambar, con acrónimo GPI y lema Gestión de Peticiones e Incidencias</desc>
  <!-- Isotipo institucional (#14212B + borde blanco #FFFFFF) -->
  <rect x="5" y="5" width="66" height="66" rx="18" fill="#14212B" stroke="#FFFFFF" stroke-width="2.5" />
  <!-- Barras ascendentes en blanco puro -->
  <rect x="18" y="42" width="8.5" height="18" rx="4.25" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="31" y="31" width="8.5" height="29" rx="4.25" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="44" y="20" width="8.5" height="40" rx="4.25" fill="#FFFFFF"/>
  <!-- Punto ápex ámbar corporativo -->
  <circle cx="48.25" cy="13.5" r="4.5" fill="#F59E0B"/>
  <circle cx="48.25" cy="13.5" r="7.5" fill="#F59E0B" fill-opacity="0.25"/>
  <!-- Acrónimo GPI en blanco con la I en ámbar -->
  <text x="88" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="1">GP<tspan fill="#F59E0B">I</tspan></text>
  <!-- Línea separadora con acento ámbar -->
  <rect x="88" y="50" width="225" height="1.5" fill="rgba(255,255,255,0.2)" rx="0.75"/>
  <rect x="88" y="50" width="36" height="2" fill="#F59E0B" rx="1"/>
  <!-- Subtítulo lema en una sola línea -->
  <text x="88" y="65" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" letter-spacing="0.4">GESTIÓN DE PETICIONES E INCIDENCIAS</text>
</svg>
