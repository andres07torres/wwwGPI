<svg viewBox="175 95 335 125" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Logo GPI</title>
  <desc>Isotipo azul con barras ascendentes y punto ámbar, junto al nombre GPI con la letra I en azul y el lema Gestión de Peticiones e Incidencias</desc>
  <rect x="180" y="100" width="110" height="110" rx="24" fill="#1F4FD8"/>
  <rect x="201" y="162" width="18" height="28" rx="4" fill="#FFFFFF"/>
  <rect x="227" y="144" width="18" height="46" rx="4" fill="#FFFFFF"/>
  <rect x="253" y="126" width="18" height="64" rx="4" fill="#FFFFFF"/>
  <circle cx="262" cy="114" r="6" fill="#F5A623"/>
  <text x="318" y="152" font-family="'Instrument Sans', system-ui, -apple-system, sans-serif" font-size="76px" font-weight="700" letter-spacing="3px" fill="#14212B">GP<tspan fill="#1F55D6">I</tspan></text>
  <line x1="320" y1="168" x2="505" y2="168" stroke="rgba(20, 33, 43, 0.15)" stroke-width="1.5"/>
