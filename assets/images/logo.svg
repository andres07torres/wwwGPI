  <text x="320" y="190" font-family="'Instrument Sans', system-ui, -apple-system, sans-serif" font-size="17px" font-weight="600" letter-spacing="0.5px" fill="#14212B">Gestión de Peticiones</text>
  <text x="320" y="211" font-family="'Instrument Sans', system-ui, -apple-system, sans-serif" font-size="17px" font-weight="600" letter-spacing="0.5px" fill="#5B6B78">e Incidencias</text>
</svg>
